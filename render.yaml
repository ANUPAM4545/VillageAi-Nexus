databases:
  - name: villageai-db
    databaseName: village_db
    user: village_user
    plan: free # Change to a paid plan for production

services:
  - type: web
    name: villageai-api
    plan: free
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: villageai-db
          property: connectionString
      - key: API_V1_STR
        value: /api/v1
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: CORS_ORIGINS
        value: '["https://your-vercel-domain.vercel.app"]' # Replace with your actual Vercel domain after deploying frontend
      - key: AI_PROVIDER
        value: openai # or gemini/fake
      - key: AI_API_KEY
        sync: false # Set this manually in the Render dashboard
      - key: AI_MODEL
        value: gpt-4o-mini # or appropriate model
